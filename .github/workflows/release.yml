name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/release.yml', 'Cargo.toml', 'Cargo.lock']

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 20
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            command: cargo
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            command: cross
          - os: macos-latest
            target: aarch64-apple-darwin
            command: cargo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install cross compiler and strip
        if: matrix.command == 'cross'
        run: |
          cargo install cross --version 0.2.5 --locked
          sudo apt-get update
          sudo apt-get install --yes binutils-aarch64-linux-gnu
      - name: Build
        run: ${{ matrix.command }} build --release --locked --target ${{ matrix.target }}
      - name: Verify native binary version
        if: matrix.command == 'cargo'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$(target/"$TARGET"/release/tmux-sidecar --version)" = "tmux-sidecar $version ($(git rev-parse HEAD))"
      - name: Strip and archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == aarch64-unknown-linux-gnu ]]; then
            aarch64-linux-gnu-strip "target/$TARGET/release/tmux-sidecar"
          else
            strip "target/$TARGET/release/tmux-sidecar"
          fi
          mkdir -p dist package
          cp "target/$TARGET/release/tmux-sidecar" README.md LICENSE package/
          archive_ref="${GITHUB_REF_NAME//\//-}"
          tar -czf "dist/tmux-sidecar-$archive_ref-$TARGET.tar.gz" -C package tmux-sidecar README.md LICENSE
      - name: Verify archive contents
        shell: bash
        run: |
          tar -tzf dist/*.tar.gz | sort > actual
          printf '%s\n' LICENSE README.md tmux-sidecar | sort > expected
          diff -u expected actual
      - name: Verify package checksum
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum *.tar.gz > SHA256SUMS
            sha256sum -c SHA256SUMS
          else
            shasum -a 256 *.tar.gz > SHA256SUMS
            shasum -a 256 -c SHA256SUMS
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tmux-sidecar-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  checksums:
    timeout-minutes: 20
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tmux-sidecar-*
          merge-multiple: true
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: |
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 3
          sha256sum *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tmux-sidecar-checksums
          path: dist/SHA256SUMS
  publish:
    needs: checksums
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tmux-sidecar-*
          merge-multiple: true
          path: dist
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" ./*.tar.gz SHA256SUMS \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
